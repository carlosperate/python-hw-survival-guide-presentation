    <!--
      Slide recipes
      -------------
      data-board="cover"   full board artwork (traces, pin header, LEDs)
      data-board="section" dimmed artwork, no pin header, for part dividers
      (omitted)            frame + footer rail only, for content

      class="is-centered"  centre the slide content vertically
      class="section-slide" + data-part="02"  giant ghosted part number
    -->
    <!-- Shared by every diagram's arrows; outside the slides, so it renders
         while the slide that would otherwise hold it is hidden. -->
    <svg class="svg-defs" width="0" height="0" aria-hidden="true">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="arrowhead" d="M0 0 L10 5 L0 10 z" />
        </marker>
      </defs>
    </svg>
