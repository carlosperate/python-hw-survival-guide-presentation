<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none" role="presentation">
  <!--
    Classic's frame, grouped so theme.css can clear or dim parts: the QR's QFN
    and its escapes are one group, and each edge stub is its own.
  -->
  <defs>
    <symbol id="via-gold" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="12" fill="var(--pcb-gold, #FDCA42)" />
      <circle cx="12" cy="12" r="5.2" fill="var(--pcb-board, #002E18)" />
    </symbol>
    <symbol id="via-blue" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="12" fill="var(--pcb-blue, #3FA0F0)" />
      <circle cx="12" cy="12" r="5.2" fill="var(--pcb-board, #002E18)" />
    </symbol>
    <!-- Edge traces run off the board and are cut flush with the outline's inner
         edge: the outline path inset by 1px, so keep the two in step. A clip, not
         a mask, because Chrome rasterises masks onto every PDF page. -->
    <clipPath id="frame-board-inside">
      <path d="M 46.4 19 H 1233.6 L 1261 46.4 V 673.6 L 1233.6 701 H 46.4 L 19 673.6 V 46.4 Z" />
    </clipPath>
  </defs>

  <path d="M 46 18 H 1234 L 1262 46 V 674 L 1234 702 H 46 L 18 674 V 46 Z"
        stroke="var(--pcb-gold, #FDCA42)" stroke-opacity="0.2" stroke-width="2" />

  <g id="edge-stub-left">
    <path d="M 0 108 H 36 L 52 124 V 286" stroke="var(--pcb-gold, #FDCA42)" stroke-width="2.6"
          stroke-opacity="0.82" stroke-linejoin="round" clip-path="url(#frame-board-inside)" />
    <use href="#via-gold" x="45" y="279" width="14" height="14" />
  </g>

  <g id="edge-stub-right">
    <path d="M 1280 250 H 1234 L 1214 230 V 150" stroke="var(--pcb-gold, #FDCA42)"
          stroke-width="2.6" stroke-opacity="0.82" stroke-linejoin="round" clip-path="url(#frame-board-inside)" />
    <use href="#via-gold" x="1207" y="143" width="14" height="14" />
  </g>

  <g id="qr-footprint">
    <rect x="1120" y="587" width="92" height="92" rx="4" fill="none"
          stroke="var(--pcb-gold, #FDCA42)" stroke-opacity="0.45" stroke-width="1.5" />
    <g fill="var(--pcb-gold, #FDCA42)" fill-opacity="0.72">
      <rect x="1129" y="577" width="4" height="10" rx="1.5" />
      <rect x="1129" y="679" width="4" height="10" rx="1.5" />
      <rect x="1143" y="577" width="4" height="10" rx="1.5" />
      <rect x="1143" y="679" width="4" height="10" rx="1.5" />
      <rect x="1157" y="577" width="4" height="10" rx="1.5" />
      <rect x="1157" y="679" width="4" height="10" rx="1.5" />
      <rect x="1171" y="577" width="4" height="10" rx="1.5" />
      <rect x="1171" y="679" width="4" height="10" rx="1.5" />
      <rect x="1185" y="577" width="4" height="10" rx="1.5" />
      <rect x="1185" y="679" width="4" height="10" rx="1.5" />
      <rect x="1199" y="577" width="4" height="10" rx="1.5" />
      <rect x="1199" y="679" width="4" height="10" rx="1.5" />
      <rect x="1110" y="596" width="10" height="4" rx="1.5" />
      <rect x="1212" y="596" width="10" height="4" rx="1.5" />
      <rect x="1110" y="610" width="10" height="4" rx="1.5" />
      <rect x="1212" y="610" width="10" height="4" rx="1.5" />
      <rect x="1110" y="624" width="10" height="4" rx="1.5" />
      <rect x="1212" y="624" width="10" height="4" rx="1.5" />
      <rect x="1110" y="638" width="10" height="4" rx="1.5" />
      <rect x="1212" y="638" width="10" height="4" rx="1.5" />
      <rect x="1110" y="652" width="10" height="4" rx="1.5" />
      <rect x="1212" y="652" width="10" height="4" rx="1.5" />
      <rect x="1110" y="666" width="10" height="4" rx="1.5" />
      <rect x="1212" y="666" width="10" height="4" rx="1.5" />
    </g>
    <circle cx="1111" cy="578" r="3" fill="var(--pcb-gold, #FDCA42)" fill-opacity="0.8" />

    <!-- Escapes: right and bottom run out to the board outline, left and
         top stop on vias. -->
    <g stroke="var(--pcb-gold, #FDCA42)" stroke-width="1.5" stroke-opacity="0.85"
       stroke-linecap="round" stroke-linejoin="round" clip-path="url(#frame-board-inside)">
      <path d="M 1222 598 H 1230 L 1244 584 H 1280" />
      <path d="M 1222 612 H 1230 L 1244 598 H 1280" />
      <path d="M 1222 626 H 1230 L 1244 612 H 1280" />
      <path d="M 1222 640 H 1230 L 1244 626 H 1280" />
      <path d="M 1222 654 H 1230 L 1244 640 H 1280" />
      <path d="M 1222 668 H 1230 L 1244 654 H 1280" />
      <path d="M 1131 577 V 565" />
      <path d="M 1145 577 V 557" />
      <path d="M 1159 577 V 565" />
      <path d="M 1173 577 V 557" />
      <path d="M 1187 577 V 565" />
      <path d="M 1201 577 V 550 L 1280 471" />
      <path d="M 1110 598 H 1068" />
      <path d="M 1110 612 H 1056" />
      <path d="M 1110 626 H 1044" />
      <path d="M 1110 640 H 1032" />
      <path d="M 1110 654 H 1020" />
      <path d="M 1110 668 H 1084 L 1070 682 V 720" />
      <path d="M 1131 689 V 720" />
      <path d="M 1145 689 V 720" />
      <path d="M 1159 689 V 720" />
      <path d="M 1173 689 V 720" />
      <path d="M 1187 689 V 720" />
      <path d="M 1201 689 V 720" />
      <path d="M 1006 672 H 1024 L 1038 686 V 720" />
    </g>

    <g>
      <use href="#via-gold" x="1126" y="560" width="10" height="10" />
      <use href="#via-gold" x="1140" y="552" width="10" height="10" />
      <use href="#via-gold" x="1154" y="560" width="10" height="10" />
      <use href="#via-gold" x="1168" y="552" width="10" height="10" />
      <use href="#via-gold" x="1182" y="560" width="10" height="10" />
      <use href="#via-gold" x="1063" y="593" width="10" height="10" />
      <use href="#via-gold" x="1051" y="607" width="10" height="10" />
      <use href="#via-gold" x="1039" y="621" width="10" height="10" />
      <use href="#via-gold" x="1027" y="635" width="10" height="10" />
      <use href="#via-gold" x="1015" y="649" width="10" height="10" />
      <use href="#via-gold" x="1001" y="667" width="10" height="10" />
      <use href="#via-gold" x="1228" y="685" width="10" height="10" />
    </g>
  </g>

  <g id="fiducial" stroke="var(--pcb-gold, #FDCA42)" stroke-opacity="0.26" stroke-width="1.5">
    <circle cx="1222" cy="64" r="9" />
    <path d="M 1222 46 v 10 M 1222 72 v 10 M 1204 64 h 10 M 1230 64 h 10" />
  </g>

  <g id="corner-dots" fill="var(--pcb-gold, #FDCA42)" fill-opacity="0.22">
    <circle cx="58" cy="628" r="3" /><circle cx="76" cy="628" r="3" /><circle cx="94" cy="628" r="3" />
    <circle cx="58" cy="646" r="3" /><circle cx="76" cy="646" r="3" /><circle cx="94" cy="646" r="3" />
    <circle cx="58" cy="664" r="3" /><circle cx="76" cy="664" r="3" /><circle cx="94" cy="664" r="3" />
  </g>
</svg>
