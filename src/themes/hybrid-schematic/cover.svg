    <rect x="1034" y="130" width="12" height="50" fill="var(--schem-body, #FFFFC2)" />
    <rect x="1062" y="130" width="12" height="50" fill="var(--schem-body, #FFFFC2)" />
    <path d="M 1000 240 H 1020 M 1000 280 H 1020 M 960 170 V 190 M 960 370 V 390
