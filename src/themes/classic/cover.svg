<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none" role="presentation">
  <!--
    Classic routing: one net crossing layers at a via, plus a power pair.
  -->
  <defs>
    <symbol id="via-gold" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="12" fill="var(--pcb-gold, #FDCA42)" />
      <circle cx="12" cy="12" r="5.2" fill="var(--pcb-board, #002E18)" />
    </symbol>
    <symbol id="via-blue" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="12" fill="var(--pcb-blue, #3FA0F0)" />
      <circle cx="12" cy="12" r="5.2" fill="var(--pcb-board, #002E18)" />
    </symbol>
  </defs>

  <g stroke="var(--pcb-gold, #FDCA42)" stroke-width="2.6" stroke-opacity="0.82"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 500 19.5 V 36 L 528 64 H 1048 L 1076 92 V 172" />
    <path d="M 487 19.5 V 49 L 515 77 H 1035 L 1063 105 V 198" />
    <path d="M 474 19.5 V 62 L 502 90 H 1022 L 1050 118 V 224" />
  </g>

  <g stroke="var(--pcb-blue, #3FA0F0)" stroke-width="2.6" stroke-opacity="0.82"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1076 172 V 427 L 1048 455 H 928 L 900 483 V 572 L 872 600 H 150" />
    <path d="M 1063 198 V 414 L 1035 442 H 915 L 887 470 V 559 L 859 587 H 178" />
    <path d="M 1050 224 V 401 L 1022 429 H 902 L 874 457 V 546 L 846 574 H 206" />
  </g>

  <g stroke="var(--pcb-gold, #FDCA42)" stroke-width="5" stroke-opacity="0.82"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 37.5 690 H 212.5 L 240 662.5 H 240 L 267.5 635 H 960" />
    <path d="M 24.5 677 H 199.5 L 227 649.5 H 227 L 254.5 622 H 934" />
  </g>

  <g>
    <use href="#via-gold" x="1068.8" y="164.8" width="14.3" height="14.3" />
    <use href="#via-gold" x="1055.8" y="190.8" width="14.3" height="14.3" />
    <use href="#via-gold" x="1042.8" y="216.8" width="14.3" height="14.3" />
    <use href="#via-blue" x="142.8" y="592.8" width="14.3" height="14.3" />
    <use href="#via-blue" x="170.8" y="579.8" width="14.3" height="14.3" />
    <use href="#via-blue" x="198.8" y="566.8" width="14.3" height="14.3" />
    <use href="#via-gold" x="949" y="624" width="22" height="22" />
    <use href="#via-gold" x="923" y="611" width="22" height="22" />
  </g>

  <g fill="var(--pcb-gold, #FDCA42)" fill-opacity="0.3">
    <circle cx="1206" cy="196" r="3" /><circle cx="1224" cy="196" r="3" /><circle cx="1242" cy="196" r="3" />
    <circle cx="1206" cy="214" r="3" /><circle cx="1224" cy="214" r="3" /><circle cx="1242" cy="214" r="3" />
    <circle cx="1206" cy="232" r="3" /><circle cx="1224" cy="232" r="3" /><circle cx="1242" cy="232" r="3" />
    <circle cx="1206" cy="250" r="3" /><circle cx="1224" cy="250" r="3" /><circle cx="1242" cy="250" r="3" />
  </g>
</svg>
